services:
  postgres:
    image: postgres:17-alpine
    container_name: expenser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expenser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenser}
      POSTGRES_DB: ${POSTGRES_DB:-expenser}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expenser} -d ${POSTGRES_DB:-expenser}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
